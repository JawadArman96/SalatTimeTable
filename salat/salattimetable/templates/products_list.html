<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Expense Calculator</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Shared Expense Calculator</h2>

<table id="expenseTable">
    <thead>
        <tr>
            <th>Product</th>
            <th colspan="3">People</th> 

            <!-- Dynamic People Column Header -->
            
            <!-- <th>Price</th> -->
        </tr>
        <tr id="peopleHeaders">
            <th></th> <!-- Placeholder for Product Column -->
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<h3>Total Amount to Pay</h3>
<div id="totals"></div>

<button onclick="calculateTotal()">Calculate</button>


<script type="application/json" id="persons-data">
    {{ persons|safe }}
</script>

<script>
const products = [
    { name: "KS Ultra Clean", price: 2168 },
    { name: "Crossiant", price: 998 },
    { name: "Grape", price: 1598 },
    { name: "Paprika (Capsicum)", price: 1298 },
    { name: "Mango", price: 1598 }
];

const peoples = JSON.parse(document.getElementById("persons-data").textContent);  // JSON.parse('{{ persons|escapejs }}'); //'{{ persons|escapejs }}';//["John", "William", "Smith"];
// const people = ["John", "William", "Smith"]
const people = peoples.map(person => person.name);
//const people = people_list
console.log("DEBUG:" , people)

// Function to create table dynamically
function generateTable() {
    const tableBody = document.getElementById("tableBody");
    const peopleHeaders = document.getElementById("peopleHeaders");
    const totalsDiv = document.getElementById("totals");

    // Create headers for people dynamically
    peopleHeaders.innerHTML += people.map(person => `<th>${person}</th>`).join("") + "<th>Price</th>";


    // Generate table rows
    tableBody.innerHTML = products.map(product => {
        return `
            <tr>
                <td>${product.name}</td>
                ${people.map(person => `<td><input type="checkbox" class="person" data-person="${person}"></td>`).join("")}
                <td class="price">${product.price}</td>
            </tr>
        `;
    }).join("");

    // Generate total amount display dynamically
    totalsDiv.innerHTML = people.map(person => `<p>${person}: <span id="total${person}">0</span></p>`).join("");
}

// Function to calculate shared expenses
function calculateTotal() {
    let totals = {};
    people.forEach(person => totals[person] = 0); // Initialize totals

    document.querySelectorAll("#expenseTable tbody tr").forEach(row => {
        let price = parseFloat(row.querySelector(".price").textContent);
        let selectedPeople = Array.from(row.querySelectorAll("input.person:checked"))
                                 .map(checkbox => checkbox.dataset.person);

        if (selectedPeople.length > 0) {
            let splitAmount = price / selectedPeople.length;
            selectedPeople.forEach(person => {
                totals[person] += splitAmount;
            });
        }
    });

    // Update totals on the page
    people.forEach(person => {
        document.getElementById(`total${person}`).textContent = totals[person].toFixed(2);
    });
}

// Generate table on page load
generateTable();
</script>

</body>
</html>
